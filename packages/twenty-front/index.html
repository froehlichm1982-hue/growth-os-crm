<!doctype html>
<html lang="en" translate="no" class="light" data-theme="light" data-m="crm">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/images/growth-os/favicon.png"
      data-rh="true"
    />
    <link
      rel="preload"
      href="./src/gos/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="apple-touch-icon" href="/images/icons/ios/192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#111E32" />
    <meta name="description" content="Growth OS CRM by ScalePoint Ventures: a fast B2B CRM with isolated workspaces, pipelines and custom objects." />
    <meta property="og:description" content="Growth OS CRM by ScalePoint Ventures: a fast B2B CRM with isolated workspaces, pipelines and custom objects." />
    <meta property="og:title" content="Growth OS CRM" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Growth OS CRM by ScalePoint Ventures: a fast B2B CRM with isolated workspaces, pipelines and custom objects." />
    <meta name="twitter:title" content="Growth OS CRM" />
    <title>Growth OS CRM</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
